services:
  test-db:
    image: postgres:16
    environment:
      POSTGRES_USER: balancezero_test
      POSTGRES_PASSWORD: balancezero_test
      POSTGRES_DB: balancezero_test
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U balancezero_test"]
      interval: 2s
      timeout: 2s
      retries: 15
