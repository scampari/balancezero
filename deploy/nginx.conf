server {
    listen 80;

    # API — proxied to the Flask Service. Same-origin from the browser's
    # point of view, so the SameSite=Strict refresh cookie behaves exactly
    # as intended (see changes/004-plaid-and-self-host, "single-hostname"
    # assumption).
    location /api/ {
        proxy_pass http://backend:5002;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # SPA — static build with client-side routing fallback.
    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }
}
