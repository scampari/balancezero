# SHAPE ONLY — never commit real values. The real secret is created
# imperatively; see deploy/README.md step 5.
apiVersion: v1
kind: Secret
metadata:
  name: balancezero-secrets
  namespace: balancezero
stringData:
  SECRET_KEY: "<generated>"
  PLAID_ENCRYPTION_KEY: "<generated Fernet key>"
  PLAID_CLIENT_ID: "<from Plaid dashboard>"
  PLAID_SECRET: "<from Plaid dashboard>"
  POSTGRES_PASSWORD: "<generated>"
  DATABASE_URL: "postgresql://balancezero:<POSTGRES_PASSWORD>@postgres:5432/balancezero"
