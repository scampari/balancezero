apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: balancezero
spec:
  selector:
    app: frontend
  ports:
    - port: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: balancezero
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: balancezero-frontend:latest
          imagePullPolicy: IfNotPresent # local image (k3d import, or `k3s ctr images import`)
          ports:
            - containerPort: 80
          resources:
            requests: { cpu: 10m, memory: 24Mi }
            limits: { memory: 96Mi }
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 2
            periodSeconds: 5
