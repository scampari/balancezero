apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: balancezero
spec:
  selector:
    app: backend
  ports:
    - port: 5002
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: balancezero
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      # Migrations run before the app starts — same image, different
      # command. Safe to re-run (alembic no-ops when current).
      initContainers:
        - name: migrate
          image: balancezero-backend:latest
          imagePullPolicy: IfNotPresent # local image, imported via k3d
          command: ["flask", "db", "upgrade"]
          envFrom:
            - secretRef:
                name: balancezero-secrets
            - configMapRef:
                name: balancezero-config
      containers:
        - name: backend
          image: balancezero-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5002
          envFrom:
            - secretRef:
                name: balancezero-secrets
            - configMapRef:
                name: balancezero-config
          readinessProbe:
            httpGet:
              path: /api/health
              port: 5002
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: balancezero-config
  namespace: balancezero
data:
  FLASK_APP: app.py
  FLASK_DEBUG: "0"
  PLAID_ENV: sandbox # flip to "production" once real bank linking goes live
  ALLOWED_ORIGIN: https://balancezero.tailbae83d.ts.net
