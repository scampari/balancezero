apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: balancezero
spec:
  selector:
    app: backend
  ports:
    - port: 5002
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: balancezero
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      # Migrations run before the app starts — same image, different
      # command. Safe to re-run (alembic no-ops when current).
      initContainers:
        - name: migrate
          image: balancezero-backend:latest
          imagePullPolicy: IfNotPresent # local image (k3d import, or `k3s ctr images import`)
          command: ["flask", "db", "upgrade"]
          envFrom:
            - secretRef:
                name: balancezero-secrets
            - configMapRef:
                name: balancezero-config
          resources:
            requests: { cpu: 25m, memory: 96Mi }
            limits: { memory: 256Mi }
      containers:
        - name: backend
          image: balancezero-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5002
          envFrom:
            - secretRef:
                name: balancezero-secrets
            - configMapRef:
                name: balancezero-config
          resources:
            requests: { cpu: 50m, memory: 160Mi }
            limits: { memory: 384Mi }
          readinessProbe:
            httpGet:
              path: /api/health
              port: 5002
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: balancezero-config
  namespace: balancezero
data:
  FLASK_APP: app.py
  FLASK_DEBUG: "0"
  # "production" for real bank data; "sandbox" for fake test data. The
  # matching PLAID_CLIENT_ID/PLAID_SECRET (per-environment) live in the Secret.
  PLAID_ENV: production
  ALLOWED_ORIGIN: https://balancezero.tailbae83d.ts.net
  # OAuth institutions (Capital One, Chase, ...) redirect the browser back
  # here mid-Link. Must exactly match an "Allowed redirect URI" registered
  # in the Plaid dashboard. Same host as ALLOWED_ORIGIN, path /accounts.
  PLAID_REDIRECT_URI: https://balancezero.tailbae83d.ts.net/accounts
  # Reverse-proxy hops in front of Flask (nginx, then the Tailscale
  # ingress) so the login/signup rate limiter keys on the real tailnet
  # client IP, not a proxy's. Start at 1; bump if two devices on the
  # tailnet share a rate-limit bucket (verify after deploy).
  TRUSTED_PROXY_COUNT: "1"
